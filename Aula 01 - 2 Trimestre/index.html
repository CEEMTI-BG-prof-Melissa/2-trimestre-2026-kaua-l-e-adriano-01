<!DOCTYPE HTML>
<html lang="pt-br">
<head>
    <title>Formulário HTML</title><!--ACERTEI-->
    <meta charset="UTF-8">
</head><!--ACERTEI-->

<body>
    <h1>Cadastro de Usuário</h1><!--ACERTEI-->
    <form action="cadastro.php" method="get"><!--ACERTEI-->
    <label for="nome">Nome:</label>
    <input type="text" name="nome" id="nome"><!--ACERTEI-->
    <br>
    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email"><!--ACERTEI-->
    <br>
    <label for="senha">Senha:</label>
    <input type="password" name="senha" id="senha"><!--ACERTEI-->
    <br>
    <label for="idade">Idade:</label>
    <input type="number" id="idade" name="idade">
    <br>
    <label for="nascimento">Data de nascimento:</label><!--ACERTEI-->
    <input type="date" id="nascimento" name="nascimento"><!--ACERTEI-->
    <br>
    <p>Turno:</p>
    <input type="radio" name="turno" id="manha" value="manha"> <label for="manha">Manhã</label>
    <input type="radio" name="turno" id="tarde" value="tarde"> <label for="tarde">Tarde</label><!--ACERTEI--><!--ACERTEI-->
    <input type="radio" name="turno" id="noite" value="noite"> <label for="noite">Noite</label>
    <br>
    <p>Áreas de interesse:</p>
    <input type="checkbox" name="area[]" id="programacao" value="programacao"> <label for="programacao">Programação</label>
    <input type="checkbox" name="area[]" id="design" value="design"> <label for="design">Design</label>
    <input type="checkbox" name="area[]" id="redes" value="redes"> <label for="redes">Redes</label><!--ACERTEI-->
    <br>
    <input type="submit" value="Enviar"><!--ACERTEI-->
    <input type="reset" value="Limpar"><!--ACERTEI-->
    </form>
</body>
</html>
